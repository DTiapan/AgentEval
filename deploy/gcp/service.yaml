apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agenteval-service
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 1800
      volumes:
        - name: agenteval-data
          csi:
            driver: gcsfuse.run.googleapis.com
            volumeAttributes:
              bucketName: PROJECT_ID-agenteval-data
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/agenteval-repo/agenteval:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2000m"
              memory: 4Gi
          env:
            - name: AGENTEVAL_DATA_DIR
              value: "/app/data"
            - name: AGENTEVAL_USE_SQLITE
              value: "1"
            - name: AGENTEVAL_SERVE_UI
              value: "1"
            - name: AGENTEVAL_UI_DIST
              value: "/app/web/dist"
            - name: AGENTEVAL_REAL_AGENT_MODEL
              value: "deepseek/deepseek-v4-flash-0731"
            - name: AGENTEVAL_ENABLED_DOMAIN_PACKS
              value: "fintech"
            # Secret Manager environment bindings
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: openrouter-api-key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: deepseek-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: openai-api-key
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: typesafe-api-key
          volumeMounts:
            - name: agenteval-data
              mountPath: /app/data
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
