steps:
  # 1. Build multi-stage container image
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker build -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/agenteval:${COMMIT_SHA}" \
                     -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/agenteval:latest" \
                     -f Dockerfile .

  # 2. Push image to Google Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/agenteval"

  # 3. Deploy to Google Cloud Run (Gen2, 2 vCPUs, 4 GiB memory, GCS persistent volume)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/agenteval:${COMMIT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=4Gi"
      - "--cpu=2"
      - "--cpu-boost"
      - "--execution-environment=gen2"
      - "--timeout=300"
      - "--concurrency=20"
      - "--add-volume=name=agenteval-data,type=cloud-storage,bucket=${PROJECT_ID}-agenteval-data"
      - "--add-volume-mount=volume=agenteval-data,mount-path=/app/data"
      - "--set-env-vars=AGENTEVAL_DATA_DIR=/app/data,AGENTEVAL_USE_SQLITE=1,AGENTEVAL_SERVE_UI=1,AGENTEVAL_UI_DIST=/app/web/dist"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/agenteval:${COMMIT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/agenteval:latest"

substitutions:
  _REGION: "us-central1"
  _REPO_NAME: "agenteval-repo"
  _SERVICE_NAME: "agenteval-service"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
